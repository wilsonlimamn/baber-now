# docker-compose.yml para a pasta /home/ec2-user/app_barbernow
# Conecta diretamente na mesma rede do PostgreSQL existente (app_default)
# IMPORTANTE: NÃO ALTERAR o nome do banco (barbernow) nem o usuário (barbernow_user)
# Esse banco e usuário já foram criados manualmente no container algodoal-postgres

services:
  barber-now-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barber-now-app
    restart: unless-stopped
    ports:
      - "3001:3000"  # Porta 3001 para não conflitar com a 3000 do algodoal-connect-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Conecta ao PostgreSQL já existente (algodoal-postgres) no banco barbernow
      - DATABASE_URL=postgresql://barbernow_user:senha_forte_aqui@algodoal-postgres:5432/barbernow
    networks:
      - app_default
    mem_limit: 200m
    mem_reservation: 100m

networks:
  app_default:
    external: true  # Usa a rede Docker já existente no servidor
