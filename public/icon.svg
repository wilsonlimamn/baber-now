<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    
    <linearGradient id="blueMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="blueLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="60%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="combGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fundo Circular Branco -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  
  <!-- Borda Externa Azul -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#blueMainGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- PENTE DE BARBEIRO Inclinado a 45 graus cruzando o centro -->
    <g transform="rotate(-35 256 256)">
      <!-- Dorso do Pente -->
      <rect x="130" y="235" width="252" height="32" rx="10" fill="url(#combGrad)" stroke="#1D4ED8" stroke-width="1.5"/>
      
      <!-- Detalhes do Dorso -->
      <line x1="145" y1="243" x2="367" y2="243" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      
      <!-- Dentes do Pente (Finis e Largos) -->
      <rect x="145" y="267" width="8" height="60" rx="3" fill="url(#combGrad)"/>
      <rect x="160" y="267" width="8" height="60" rx="3" fill="url(#combGrad)"/>
      <rect x="175" y="267" width="8" height="60" rx="3" fill="url(#combGrad)"/>
      <rect x="190" y="267" width="8" height="60" rx="3" fill="url(#combGrad)"/>
      <rect x="205" y="267" width="8" height="60" rx="3" fill="url(#combGrad)"/>
      <rect x="220" y="267" width="8" height="60" rx="3" fill="url(#combGrad)"/>
      <rect x="235" y="267" width="8" height="60" rx="3" fill="url(#combGrad)"/>

      <rect x="252" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="262" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="272" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="282" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="292" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="302" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="312" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="322" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="332" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="342" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="352" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
      <rect x="362" y="267" width="5" height="58" rx="2" fill="url(#combGrad)"/>
    </g>

    <!-- TESOURA DE BARBEIRO CLÁSSICA Cruzando aberta -->
    <g>
      <!-- Olhal Esquerdo -->
      <circle cx="160" cy="370" r="38" fill="none" stroke="url(#blueMainGrad)" stroke-width="16"/>
      <!-- Apoio de Dedo / Tang -->
      <path d="M 125 385 C 110 405 105 425 110 435 C 115 440 125 435 132 415" fill="none" stroke="url(#blueMainGrad)" stroke-width="8" stroke-linecap="round"/>
      <!-- Haste esquerda -->
      <path d="M 185 345 L 245 270" stroke="url(#blueMainGrad)" stroke-width="18" stroke-linecap="round"/>
      <!-- Lâmina Direita que aponta para cima -->
      <path d="M 245 270 Q 305 210 380 135 C 385 130 388 134 384 140 Q 310 230 265 270 Z" fill="url(#blueMainGrad)" stroke="#1E40AF" stroke-width="1.5"/>

      <!-- Olhal Direito -->
      <circle cx="340" cy="370" r="38" fill="none" stroke="url(#blueLightGrad)" stroke-width="16"/>
      <!-- Haste direita -->
      <path d="M 315 345 L 255 270" stroke="url(#blueLightGrad)" stroke-width="18" stroke-linecap="round"/>
      <!-- Lâmina Esquerda que aponta para cima -->
      <path d="M 255 270 Q 195 210 125 135 C 120 130 117 134 121 140 Q 195 230 240 270 Z" fill="url(#blueLightGrad)" stroke="#1D4ED8" stroke-width="1.5"/>

      <!-- Parafuso Central com Joia Azul -->
      <circle cx="256" cy="270" r="16" fill="url(#blueMainGrad)" stroke="#1D4ED8" stroke-width="3"/>
      <circle cx="256" cy="270" r="6" fill="#93C5FD"/>
    </g>

    <!-- Letras Barber-Now -->
    <text x="256" y="465" text-anchor="middle" fill="#1D4ED8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="4">BARBER-NOW</text>
  </g>
</svg>
